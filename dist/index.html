<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkVault AI</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230284c7'/%3E%3Ctext x='32' y='44' font-family='Inter,Arial,sans-serif' font-size='34' font-weight='900' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
    <meta name="description" content="Seu gerenciador de links, simples e organizado." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="login-screen">
      <div class="login-card">
        <div class="login-header">
          <div class="login-logo"><span>L</span></div>
          <h1 class="login-title">LinkVault AI</h1>
          <p class="login-subtitle">Bem-vindo de volta</p>
        </div>

        <form class="login-form" id="login-form">
          <div class="login-field">
            <label for="usuario">Usuário</label>
            <div class="input-wrap">
              <svg
                class="field-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect width="20" height="16" x="2" y="4" rx="2" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
              </svg>
              <input
                id="usuario"
                type="text"
                required
                placeholder="usuário"
                autocomplete="username"
              />
            </div>
          </div>

          <div class="login-field">
            <label for="senha">Senha</label>
            <div class="input-wrap">
              <svg
                class="field-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input
                id="senha"
                type="password"
                required
                placeholder="••••••••"
                autocomplete="current-password"
              />
            </div>
          </div>

          <button type="submit" class="login-submit">
            Entrar Agora
            <svg
              class="submit-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </button>
        </form>

        <div class="signup-row">
          <button type="button" class="signup-btn" id="signup-btn">
            Não tem uma conta? Crie agora
          </button>
          <p class="signup-hint" id="signup-hint" hidden>
            Conta demo: qualquer usuário e senha funcionam.
          </p>
        </div>

        <div class="login-footer">
          <p>ACESSO RESTRITO • LINKVAULT V1.0</p>
        </div>
      </div>
    </div>

    <script src="./assets/login.js" defer></script>
  </body>
</html>
